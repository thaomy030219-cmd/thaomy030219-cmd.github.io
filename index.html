<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho Ứng Dụng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1620;
    --bg2:#13212f;
    --panel:#16232f;
    --panel-2:#1b2c3c;
    --grid:rgba(140,180,220,0.05);
    --line:#28394a;
    --text:#eef3f8;
    --text-dim:#8ba1b5;
    --accent:#e8722a;
    --accent-dim:rgba(232,114,42,.18);
    --cyan:#2fa8cc;
    --ok:#35b586;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/32px 32px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/32px 32px,
      radial-gradient(ellipse at top, var(--bg2) 0%, var(--bg) 65%);
    background-attachment:fixed;
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:920px;margin:0 auto;padding:36px 20px 8px;}

  header.top{padding:4px 4px 30px;border-bottom:1px solid var(--line);margin-bottom:32px;}
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;letter-spacing:.18em;color:var(--accent);
    text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:10px;
  }
  .eyebrow::before{content:"";width:18px;height:2px;background:var(--accent);display:inline-block;}
  h1{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:52px;
    letter-spacing:.01em;margin:0 0 10px;line-height:1;text-transform:uppercase;
  }
  h1 span{color:var(--accent);}
  .sub{color:var(--text-dim);font-size:14.5px;line-height:1.6;max-width:56ch;}

  .stats{display:flex;gap:22px;margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);}
  .stats b{color:var(--text);font-weight:600;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(max-width:680px){.grid{grid-template-columns:1fr;}}

  .card{
    position:relative;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px 20px 18px;
    display:flex;flex-direction:column;gap:12px;
    transition:.15s ease;
  }
  .card:hover{border-color:var(--accent-dim);box-shadow:0 8px 24px -12px rgba(0,0,0,.5);}
  .card::before{
    content:"";position:absolute;top:14px;right:14px;width:7px;height:7px;
    border-radius:50%;background:var(--line);box-shadow:-16px 0 0 var(--line);
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .catno{
    font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);
    letter-spacing:.08em;
  }
  .badge{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;
    padding:3px 8px;border-radius:5px;border:1px solid var(--line);color:var(--text-dim);
    text-transform:uppercase;white-space:nowrap;
  }
  .badge.apk{color:var(--ok);border-color:rgba(53,181,134,.35);}
  .badge.exe{color:var(--cyan);border-color:rgba(47,168,204,.35);}
  .badge.pwa{color:var(--accent);border-color:var(--accent-dim);}

  .card h2{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;
    margin:0;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;
  }
  .card p.desc{color:var(--text-dim);font-size:13.5px;line-height:1.55;margin:0;flex:1;}

  .meta{
    display:flex;gap:14px;font-family:'JetBrains Mono',monospace;font-size:11px;
    color:var(--text-dim);padding-top:10px;border-top:1px solid var(--line);
  }
  .meta .k{color:#5c7488;margin-right:4px;}

  .dl{
    margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#1a1006;text-decoration:none;
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    padding:10px 14px;border-radius:8px;transition:.15s ease;
  }
  .dl:hover{background:#f5843c;}
  .dl svg{width:14px;height:14px;flex-shrink:0;}

  footer{
    max-width:920px;margin:44px auto 0;padding:20px 20px 0;border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;font-size:11px;color:#5c7488;line-height:1.7;
  }
  footer a{color:var(--cyan);text-decoration:none;}

  .empty{
    grid-column:1/-1;border:1px dashed var(--line);border-radius:12px;
    padding:30px;text-align:center;color:var(--text-dim);font-size:13.5px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">Personal Release Index</div>
    <h1>Kho <span>Ứng Dụng</span></h1>
    <p class="sub">Nơi tập trung các ứng dụng, công cụ mình tự làm — APK cho Android, EXE cho Windows. Tải trực tiếp, không qua cửa hàng ứng dụng.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="grid" id="appGrid"></div>

  <footer>
    Cập nhật thủ công · file build lưu tại
    <a href="https://github.com" target="_blank" rel="noopener">GitHub Releases</a>
    của từng repo.
  </footer>

</div>

<script>
/* ============================================================
   THÊM APP MỚI: copy 1 khối {...} bên dưới, dán vào cuối mảng
   APPS, sửa lại thông tin. Không cần biết code — chỉ sửa chữ
   trong dấu nháy "...".

   platform: "apk" | "exe" | "pwa"
   url:      link tải trực tiếp (dán link từ GitHub Releases)
   ============================================================ */
const APPS = [
  {
    name: "Tra Thép Hình",
    platform: "apk",
    version: "v1.0.0",
    date: "2026-08-19",
    desc: "Tra cứu kích thước và đặc tính mặt cắt thép hình (I/H, kênh U, góc L, ống, hộp...) theo tiêu chuẩn Việt Nam TCVN.",
    url: "https://raw.githubusercontent.com/thaomy030219-cmd/trathephinhv1.0.0/main/app-debug.apk" // dán link file .apk từ GitHub Releases vào đây
  }

  // ,{
  //   name: "Tên app tiếp theo",
  //   platform: "exe",
  //   version: "v1.0.0",
  //   date: "2026-09-01",
  //   desc: "Mô tả ngắn gọn app này dùng để làm gì.",
  //   url: "https://github.com/ten-ban/repo/releases/download/v1.0.0/app.exe"
  // }
];

const platformLabel = { apk: "Android · APK", exe: "Windows · EXE", pwa: "Web · PWA" };

function render(){
  const grid = document.getElementById('appGrid');
  const stats = document.getElementById('stats');

  if(APPS.length === 0){
    grid.innerHTML = `<div class="empty">Chưa có app nào — thêm vào mảng APPS trong file này.</div>`;
    stats.innerHTML = '';
    return;
  }

  const counts = APPS.reduce((acc,a)=>{acc[a.platform]=(acc[a.platform]||0)+1;return acc;},{});
  stats.innerHTML = `<span><b>${APPS.length}</b> ứng dụng</span>` +
    Object.entries(counts).map(([k,v])=>`<span><b>${v}</b> ${platformLabel[k]?.split(' · ')[1]||k}</span>`).join('');

  grid.innerHTML = APPS.map((a,i)=>{
    const cat = 'APP-' + String(i+1).padStart(3,'0');
    return `
    <div class="card">
      <div class="card-top">
        <span class="catno">${cat}</span>
        <span class="badge ${a.platform}">${platformLabel[a.platform]||a.platform}</span>
      </div>
      <h2>${a.name}</h2>
      <p class="desc">${a.desc}</p>
      <div class="meta">
        <span><span class="k">Bản</span>${a.version}</span>
        <span><span class="k">Ngày</span>${a.date}</span>
      </div>
      <a class="dl" href="${a.url}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Tải xuống
      </a>
    </div>`;
  }).join('');
}
render();
</script>
</body>
</html>
